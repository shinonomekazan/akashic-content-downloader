name: テスト

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js 22 のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 依存関係のインストール
        run: npm ci

      - name: リントとテストの実行
        run: npm test

      - name: ビルドの実行
        run: npm run build
